# Nach dem Merge dev -> main: kein neuer Build, sondern Promotion des in Staging
# getesteten Images. semantic-release berechnet die Version aus den Conventional
# Commits, retaggt das Image (prepareCmd in .releaserc.json), setzt den Git-Tag
# und erstellt das GitHub Release. Danach Produktions-Deployment nach Freigabe.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write    # Git-Tag und GitHub Release
  packages: write    # Image-Tags in GHCR

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.version != '' }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release braucht Historie und Tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Nächste Version ermitteln (Trockenlauf)
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run

      - name: Kein Release nötig
        if: steps.plan.outputs.next == ''
        run: echo "::notice::Keine feat/fix/Breaking-Commits seit dem letzten Release – nichts zu tun."

      - name: Getesteten dev-Commit ermitteln
        id: source
        if: steps.plan.outputs.next != ''
        run: |
          # Der Merge-Commit hat den dev-Stand als zweiten Elternteil.
          # Ist der Code identisch, wird genau dessen Image befördert.
          if git rev-parse -q --verify HEAD^2 >/dev/null && git diff --quiet HEAD^2 HEAD; then
            sha="$(git rev-parse HEAD^2)"; rebuild=false
          else
            echo "::warning::main weicht vom getesteten dev-Stand ab (z. B. Hotfix) – Image wird neu gebaut."
            sha="${GITHUB_SHA}"; rebuild=true
          fi
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "rebuild=${rebuild}"
            echo "repo=${repo}"
            echo "image=${repo}:sha-${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        if: steps.plan.outputs.next != ''
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Rückfallebene – Image neu bauen
        if: steps.plan.outputs.next != '' && steps.source.outputs.rebuild == 'true'
        run: |
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "${{ steps.source.outputs.image }}" .
          docker push "${{ steps.source.outputs.image }}"

      - name: Prüfen, ob das zu befördernde Image existiert
        if: steps.plan.outputs.next != ''
        run: docker buildx imagetools inspect "${{ steps.source.outputs.image }}" > /dev/null

      - name: Release mit semantic-release (Retag, Git-Tag, GitHub Release)
        id: release
        if: steps.plan.outputs.next != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_IMAGE: ${{ steps.source.outputs.image }}
          IMAGE_REPO: ${{ steps.source.outputs.repo }}
        run: npx semantic-release

  deploy-production:
    needs: promote
    if: needs.promote.outputs.released == 'true'
    runs-on: [self-hosted, linux]
    environment:
      name: production   # Required Reviewers -> Pipeline wartet auf Freigabe
      url: http://localhost:8080
    env:
      APP_ENV: production
      APP_VERSION: ${{ needs.promote.outputs.version }}
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: Image-Referenz setzen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Bei GHCR anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Mit Docker Compose ausrollen
        run: |
          docker compose -p hello-production -f deploy/docker-compose.yml pull
          docker compose -p hello-production -f deploy/docker-compose.yml up -d --remove-orphans

      - name: Smoke-Test Produktion
        run: |
          for i in $(seq 1 15); do curl -fsS "http://localhost:${PORT}/health" && break; sleep 1; done
          curl -fsS "http://localhost:${PORT}/version.json" | grep -q "\"version\":\"${APP_VERSION}\""
          echo "Version ${APP_VERSION} läuft in Produktion"
