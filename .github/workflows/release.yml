# Nach dem Merge dev -> main: kein neuer Build, sondern Promotion des in Staging
# getesteten Images. Version aus Conventional Commits, Git-Tag + GitHub Release,
# danach Produktions-Deployment nach manueller Freigabe (Environment "production").
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write    # Git-Tag und GitHub Release
  packages: write    # Image-Tags in GHCR

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.version != '' }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Getesteten dev-Commit ermitteln
        id: source
        run: |
          # Der Merge-Commit hat den dev-Stand als zweiten Elternteil.
          # Ist der Code identisch, wird genau dessen Image befördert.
          if git rev-parse -q --verify HEAD^2 >/dev/null && git diff --quiet HEAD^2 HEAD; then
            echo "sha=$(git rev-parse HEAD^2)" >> "$GITHUB_OUTPUT"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main weicht vom getesteten dev-Stand ab (z. B. Hotfix) – Image wird neu gebaut."
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version berechnen
        id: version
        run: node scripts/next-version.mjs --ref "${{ steps.source.outputs.sha }}" --changelog CHANGELOG.release.md

      - name: Kein Release nötig
        if: steps.version.outputs.version == ''
        run: echo "::notice::Keine feat/fix/Breaking-Commits seit ${{ steps.version.outputs.previous }} – kein Release."

      - name: Image-Referenzen setzen
        id: image
        if: steps.version.outputs.version != ''
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "source=${repo}:sha-${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "release=${repo}:${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        if: steps.version.outputs.version != ''
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Rückfallebene – Image neu bauen
        if: steps.version.outputs.version != '' && steps.source.outputs.rebuild == 'true'
        run: |
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "${{ steps.image.outputs.source }}" .
          docker push "${{ steps.image.outputs.source }}"

      - name: Image befördern (Retag ohne Neubau)
        if: steps.version.outputs.version != ''
        run: |
          docker buildx imagetools inspect "${{ steps.image.outputs.source }}" > /dev/null
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.release }}" \
            --tag "${{ steps.image.outputs.latest }}" \
            "${{ steps.image.outputs.source }}"

      - name: Git-Tag und GitHub Release anlegen
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tag auf den getesteten dev-Commit, damit er auch von dev aus erreichbar ist
          git tag -a "v${VERSION}" "${{ steps.source.outputs.sha }}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file CHANGELOG.release.md

  deploy-production:
    needs: promote
    if: needs.promote.outputs.released == 'true'
    runs-on: [self-hosted, linux]
    environment:
      name: production   # Required Reviewers -> Pipeline wartet auf Freigabe
      url: http://localhost:8080
    env:
      IMAGE: ${{ needs.promote.outputs.image }}
      APP_ENV: production
      APP_VERSION: ${{ needs.promote.outputs.version }}
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Mit Docker Compose ausrollen
        run: |
          docker compose -p hello-production -f deploy/docker-compose.yml pull
          docker compose -p hello-production -f deploy/docker-compose.yml up -d --remove-orphans

      - name: Smoke-Test Produktion
        run: |
          for i in $(seq 1 15); do curl -fsS "http://localhost:${PORT}/health" && break; sleep 1; done
          curl -fsS "http://localhost:${PORT}/version.json" | grep -q "\"version\":\"${APP_VERSION}\""
          echo "Version ${APP_VERSION} läuft in Produktion"
